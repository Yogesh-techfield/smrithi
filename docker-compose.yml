version: '3.8'

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - SECRET_KEY=smrithi-secret-key-2026

  game-service:
    build:
      context: .
      dockerfile: services/game_service/Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001

  memory-service:
    build:
      context: .
      dockerfile: services/memory_service/Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: yogesh
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: smrithisathi_db
    ports:
      - "5432:5432"

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - auth-service
      - game-service
      - memory-service
